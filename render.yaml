# Render.com blueprint — free web service + free Postgres.
# In Render: New + → Blueprint → point it at this repo.
# The app creates its schema, admin account, and (on an empty catalog) restores
# backups/live-dump.json automatically at boot — no manual database steps.
databases:
  - name: osc-db
    plan: free

services:
  - type: web
    name: object-stream-community
    runtime: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: osc-db
          property: connectionString
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: ADMIN_USERNAME
        value: admin
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false # set in the dashboard
